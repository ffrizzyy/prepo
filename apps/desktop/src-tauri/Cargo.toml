[package]
name = "prepo-desktop"
version = "0.1.0"
description = "Prepo's desktop shell: a native window, tray, global shortcut and deep links for the web app"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
