[package]
name = "prepo-desktop"
version = "0.1.0"
description = "Prepo's desktop shell: a native window, tray, global shortcut and deep links for the web app"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-deep-link = "2.6.2"
# The lockfile pins rust-ini to 0.21.1 for tauri-plugin-deep-link's Linux-only
# desktop-entry parser. rust-ini 0.21.2 added two ParseOption fields so the
# plugin (which initializes the struct with the earlier two) stops compiling on
# Linux; 0.21.2 was then yanked for its own parser regression (#146, indented
# sections read as keys), fixed in 0.21.3, which keeps the two fields. 0.21.1 is
# the last release before the fields existed. Revisit when the plugin gains a
# release that constructs the full ParseOption.
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
