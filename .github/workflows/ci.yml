# The Prepo CI: two worlds, kept apart.
#
# - `web` runs the whole check battery on a throwaway database (every db:*
#   check suite is self-contained by construction) plus the installability and
#   desktop-configuration checks, so a push cannot silently break isolation
#   boundaries, extraction grounding, or the HTTP IDOR matrix. The restore
#   drill runs here too: a throwaway dataset is migrated, seeded and given the
#   audio fixture, then copied and verified by the same 12 checks the local
#   drill runs.
# - `scan` is the dependency and secret hygiene gate: pnpm audit against the
#   production graph and gitleaks over the full git history.
#
# Nothing here needs a hosted origin: the suites carry their own databases,
# and the IDOR suite starts its own production server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: web - typecheck, suites, build, HTTP matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm (version from package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check suites (each on a fresh throwaway database)
        run: |
          for s in verify smoke auth audio followup-smoke linear-smoke extract-smoke ai-smoke injection-smoke meeting-delete; do
            echo "--- db:$s"
            pnpm --filter @prepo/web "db:$s"
          done

      - name: Restore drill (copy a seeded throwaway dataset, verify only the copy)
        run: |
          # The drill itself never touches an operator's data; here the dataset
          # it copies is built in the checkout minutes earlier. The audio
          # fixture writes real bytes, so the storage half is exercised too
          # rather than reporting zero assets.
          pnpm --filter @prepo/web db:migrate
          pnpm --filter @prepo/web db:seed
          pnpm --filter @prepo/web db:audio-fixture
          pnpm --filter @prepo/web db:restore-drill

      - name: Build the production app
        run: pnpm build

      - name: IDOR matrix (drives the built production server)
        run: pnpm --filter @prepo/web db:idor-smoke

      - name: PWA installability (against a started production server)
        run: |
          pnpm --filter @prepo/web start > start.log 2>&1 &
          server_pid=$!
          ok=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then ok=yes; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "the production server did not come up"
            cat start.log
            exit 1
          fi
          pnpm --filter @prepo/web pwa:check
          kill "$server_pid" 2>/dev/null || true

      - name: Desktop shell configuration (capabilities, CSP, updater, icons)
        run: pnpm --filter @prepo/desktop verify

  desktop-rules:
    name: desktop shell - cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tauri prerequisites (webkit for linking the shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: The shell's rules (target refusal, deep-link grammar, workspace detection)
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  scan:
    name: scans - pnpm audit, gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the full history, not just the diff

      - name: Enable pnpm (version from package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependency audit (production graph)
        run: pnpm audit --prod

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
