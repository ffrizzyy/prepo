# Railway config-as-code for the current demo instance.
#
# `railway up` reads this file; the service is also configured in the Railway
# dashboard (volume at /data, APP_URL, DATABASE_URL). Build the repository root,
# because the Dockerfile copies the whole pnpm workspace.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
